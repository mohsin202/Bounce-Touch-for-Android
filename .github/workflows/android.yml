name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK. Just make sure its licenses are accepted
      # so Gradle can download platform 37 / build tools by itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Updates over an installed copy only work if every build is signed with the SAME key.
      # Put your key in the repo secrets (see README): KEYSTORE_BASE64, KEYSTORE_PASSWORD.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - using a throwaway key, this APK cannot update older builds"
            keytool -genkeypair -keystore release.keystore -alias bounce \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=BounceTouch"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Show size
        run: ls -lh app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BounceTouch-native
          path: app/build/outputs/apk/release/*.apk
